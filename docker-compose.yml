services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agendaflow
      POSTGRES_USER: agendaflow
      POSTGRES_PASSWORD: agendaflow
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendaflow -d agendaflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agendaflow_data:/var/lib/postgresql/data
volumes:
  agendaflow_data:
